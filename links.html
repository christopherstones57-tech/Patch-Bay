<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>Patch Bay links — copy</title>
<meta name="description" content="Copy buttons for Patch Bay's address: the live app, the repository and the promo page.">
<style>
  :root {
    --bg: #0b0d12;
    --card: #141822;
    --line: #242b3a;
    --text: #e8ecf5;
    --dim: #8f9bb3;
    --accent: #5ad1a5;
    --accent-ink: #06231a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: max(20px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom));
    max-width: 640px;
    margin: 0 auto;
    -webkit-text-size-adjust: 100%;
  }
  h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: -0.01em; }
  p.hint { margin: 0 0 20px; color: var(--dim); font-size: 14px; }
  .row {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 12px;
    margin-bottom: 12px;
  }
  .label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--dim); margin-bottom: 8px; }
  input.link {
    width: 100%;
    font: inherit;
    font-size: 15px;
    color: var(--text);
    background: #0e121a;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 11px 12px;
    -webkit-user-select: text;
    user-select: text;
  }
  button.copy {
    display: block;
    width: 100%;
    margin-top: 10px;
    font: inherit;
    font-weight: 600;
    font-size: 16px;
    padding: 13px 14px;
    border: 0;
    border-radius: 10px;
    background: var(--accent);
    color: var(--accent-ink);
    cursor: pointer;
  }
  button.copy:active { transform: scale(0.99); }
  button.copy.done { background: #2b6b53; color: #eafef6; }
  #status { min-height: 22px; font-size: 14px; color: var(--dim); margin-top: 6px; }
  footer { margin-top: 22px; font-size: 13px; color: var(--dim); }
  footer a { color: var(--accent); }
</style>
</head>
<body>
<h1>Patch Bay links</h1>
<p class="hint">Tap a Copy button. If nothing lands on the clipboard, the link is selected for you — long-press it and choose Copy.</p>

<div class="row">
  <div class="label">GitHub Pages — the live app</div>
  <input class="link" id="u1" readonly value="https://christopherstones57-tech.github.io/Patch-Bay/" aria-label="Live app link" spellcheck="false">
  <button class="copy" type="button" data-for="u1">Copy the app link</button>
</div>

<div class="row">
  <div class="label">GitHub repository</div>
  <input class="link" id="u2" readonly value="https://github.com/christopherstones57-tech/Patch-Bay" aria-label="Repository link" spellcheck="false">
  <button class="copy" type="button" data-for="u2">Copy the repo link</button>
</div>

<div class="row">
  <div class="label">Promo page</div>
  <input class="link" id="u3" readonly value="https://christopherstones57-tech.github.io/Patch-Bay/ad.html" aria-label="Promo page link" spellcheck="false">
  <button class="copy" type="button" data-for="u3">Copy the promo link</button>
</div>

<div id="status" role="status" aria-live="polite"></div>

<footer>
  <a href="./index.html">Open Patch Bay</a> · <a href="./ad.html">Promo page</a>
</footer>

<script>
  var statusEl = document.getElementById('status');

  function say(text) {
    statusEl.textContent = text;
    clearTimeout(say.timer);
    say.timer = setTimeout(function () { statusEl.textContent = ''; }, 4000);
  }

  function selectAll(input) {
    try {
      input.focus();
      input.setSelectionRange(0, input.value.length);
    } catch (e) { /* a read-only input still allows a manual selection */ }
  }

  // A browser that will not hand the page the clipboard — an app's own web view,
  // say — still runs execCommand, which copies what is selected.
  function legacyCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '0';
    ta.style.left = '0';
    ta.style.width = '1px';
    ta.style.height = '1px';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  function copy(input, button) {
    var text = input.value;
    selectAll(input);

    function finish(ok) {
      if (ok) {
        button.classList.add('done');
        say('Copied: ' + text);
        setTimeout(function () { button.classList.remove('done'); }, 1600);
      } else {
        say('Could not copy by itself — the link is selected, long-press it and choose Copy.');
      }
    }

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        finish(true);
      }, function () {
        finish(legacyCopy(text));
      });
    } else {
      finish(legacyCopy(text));
    }
  }

  var buttons = document.querySelectorAll('button.copy');
  for (var i = 0; i < buttons.length; i++) {
    (function (button) {
      button.addEventListener('click', function (event) {
        event.preventDefault();
        copy(document.getElementById(button.getAttribute('data-for')), button);
      });
    })(buttons[i]);
  }

  var inputs = document.querySelectorAll('input.link');
  for (var j = 0; j < inputs.length; j++) {
    (function (input) {
      input.addEventListener('focus', function () { selectAll(input); });
      input.addEventListener('click', function () { selectAll(input); });
    })(inputs[j]);
  }
</script>
</body>
</html>
