# Publishes Patch Bay to GitHub Pages, at
# https://<user>.github.io/Patch-Bay/ — the files as they are, with no build:
# the app is a static site, so the repository's root is the whole site.
#
# `enablement: true` turns Pages on the first time this runs, so the site needs
# no trip to Settings → Pages. Every push to main publishes again; the run can
# also be started by hand from the Actions tab.
name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time, and never cancel one that is already running: a
# half-uploaded site is worse than a slightly older one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Set up Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Pack the site
        uses: actions/upload-pages-artifact@v3
        with:
          # The whole repository is the site. The action leaves out .git and
          # .github, so the workflow itself is never served.
          path: .
      - name: Publish
        id: publish
        uses: actions/deploy-pages@v4
